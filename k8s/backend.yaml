apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-tracker-backend
  namespace: orbital-tracker
  labels:
    app: orbital-tracker
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbital-tracker
      component: backend
  template:
    metadata:
      labels:
        app: orbital-tracker
        component: backend
    spec:
      containers:
        - name: backend
          image: orbital-tracker-backend:local
          imagePullPolicy: Never
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: orbital-tracker-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: orbital-tracker
spec:
  selector:
    app: orbital-tracker
    component: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: orbital-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbital-tracker-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
