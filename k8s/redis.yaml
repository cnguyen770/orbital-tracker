# In-cluster Redis for validation. Production uses a managed Redis
# (the same cache-aside code works against either — only REDIS_URL changes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: orbital-tracker
  labels:
    app: orbital-tracker
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbital-tracker
      component: redis
  template:
    metadata:
      labels:
        app: orbital-tracker
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: orbital-tracker
spec:
  selector:
    app: orbital-tracker
    component: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
